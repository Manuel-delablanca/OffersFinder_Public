name: Comprobar precios

on:
  schedule:
    # Una vez al día, a partir de las 9 hora de España. GitHub dispara las tareas programadas con retraso
    # (a veces de horas), así que hay varios disparos repartidos y el paso "Comprobar hora local" ejecuta
    # la comprobación en el primero que llega cada día (data/last-run.txt guarda la fecha) y omite el resto.
    - cron: "17 8 * * *"
    - cron: "47 8 * * *"
    - cron: "17 9 * * *"
    - cron: "17 10 * * *"
    - cron: "17 12 * * *"
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "Guardar el HTML de cada tienda como artefacto (diagnóstico)"
        type: boolean
        default: false
      test_notify:
        description: "Solo enviar un aviso de prueba a Telegram (sin comprobar precios)"
        type: boolean
        default: false
      send_report:
        description: "Enviar además el informe HTML y el resumen por Telegram"
        type: boolean
        default: false
      force_api:
        description: "Llamar a la API de búsqueda en esta ejecución aunque esté en pausa (gasta consultas)"
        type: boolean
        default: false
      only_items:
        description: "Comprobar solo estos productos (textos del nombre o números, separados por comas). Vacío = todos"
        type: string
        default: ""
      scheduled:
        description: "Tratar esta ejecución como la programada del día (resumen diario, una vez al día). La usa el disparador externo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    # En el repositorio plantilla no se ejecuta nada; en las copias ("Use this template" o fork) sí.
    if: github.repository != 'Manuel-delablanca/OffersFinder_Public'
    runs-on: ubuntu-latest
    env:
      # Fuente de precios: Google Shopping (España) a través de Serper.dev.
      # Sin esta clave se consulta a cada tienda, pero casi todas bloquean el acceso automático.
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
      # Variable de repositorio API_PAUSE_UNTIL (AAAA-MM-DD): hasta esa fecha no se llama a la API y solo se
      # leen las fichas de producto (urls). En una ejecución manual con 'force_api' se ignora la pausa.
      API_PAUSE_UNTIL: ${{ inputs.force_api && 'none' || vars.API_PAUSE_UNTIL }}
      # Días de la semana (1 = lunes … 7 = domingo) en los que, aun en pausa, sí se llama a la API.
      API_PAUSE_EXCEPT_WEEKDAYS: ${{ vars.API_PAUSE_EXCEPT_WEEKDAYS || '1' }}
      ONLY_ITEMS: ${{ inputs.only_items }}
      # Avisos por Telegram: secretos TELEGRAM_BOT_TOKEN (token de @BotFather) y TELEGRAM_CHAT_ID
      # (lo muestra el comando 'telegram-setup'; también vale como variable de repositorio).
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
      # Opcionales: email y WhatsApp (desactivados si los secretos no existen)
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
      MIN_DROP_PERCENT: ${{ vars.MIN_DROP_PERCENT }}
      # Pon la variable de repositorio WEB_SEARCH a "false" para ahorrar consultas (solo Google Shopping)
      WEB_SEARCH: ${{ vars.WEB_SEARCH }}
      DEBUG_DIR: ${{ inputs.debug && 'debug-html' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar hora local
        id: hora
        run: |
          hora=$(TZ=Europe/Madrid date +%H:%M)
          hoy=$(TZ=Europe/Madrid date +%F)
          ultima=$(cat data/last-run.txt 2>/dev/null || echo "nunca")
          echo "fecha=$hoy" >> "$GITHUB_OUTPUT"
          echo "dia=$(TZ=Europe/Madrid date +%u)" >> "$GITHUB_OUTPUT"
          # "Programada": el cron de GitHub o una ejecución manual lanzada con la casilla 'scheduled' (disparador externo).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.scheduled }}" = "true" ]; then scheduled=true; else scheduled=false; fi
          echo "scheduled=$scheduled" >> "$GITHUB_OUTPUT"
          if [ -z "${SERPAPI_API_KEY}${SERPER_API_KEY}${TELEGRAM_BOT_TOKEN}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Este repositorio aún no está configurado: crea los secretos SERPAPI_API_KEY (o SERPER_API_KEY), TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID. Consulta el README, sección 'Instalar tu propia copia'."
          elif [ "$scheduled" = "false" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Ejecución manual a las $hora (Madrid)."
          elif [ "$ultima" = "$hoy" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Son las $hora en Madrid y la comprobación de hoy ($hoy) ya se hizo; este disparo se omite."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Son las $hora en Madrid; primera ejecución del día $hoy (última: $ultima)."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.hora.outputs.run == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Aviso de prueba
        if: ${{ inputs.test_notify && steps.hora.outputs.run == 'true' }}
        run: dotnet run --project src/OffersFinder -c Release -- test-notify

      - name: Comprobar precios
        if: ${{ !inputs.test_notify && steps.hora.outputs.run == 'true' }}
        # En las ejecuciones manuales se envía un mensaje con el resultado aunque no haya bajadas.
        run: dotnet run --project src/OffersFinder -c Release -- check ${{ steps.hora.outputs.scheduled != 'true' && '--notify-result' || '' }}

      - name: Diagnóstico de tiendas
        if: ${{ inputs.debug && !inputs.test_notify && steps.hora.outputs.run == 'true' }}
        run: dotnet run --project src/OffersFinder -c Release --no-build -- diagnose

      - name: Subir HTML de diagnóstico
        if: ${{ inputs.debug && !inputs.test_notify && steps.hora.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug-html/
          retention-days: 3
          if-no-files-found: ignore

      - name: Resumen diario con gráficas
        # Tras cada comprobación programada (o con la casilla send_report): texto y una imagen por producto.
        # La variable SUMMARY_DAILY=false lo desactiva.
        if: ${{ !inputs.test_notify && steps.hora.outputs.run == 'true' && vars.SUMMARY_DAILY != 'false' && (inputs.send_report || steps.hora.outputs.scheduled == 'true') }}
        run: |
          dotnet run --project src/OffersFinder -c Release --no-build -- summary --days 7
          dotnet run --project src/OffersFinder -c Release --no-build -- send-report --images-only

      - name: Informe semanal (archivo HTML)
        # Día de la semana (1 = lunes ... 7 = domingo) en la variable de repositorio REPORT_DAY; 'none' lo desactiva.
        if: ${{ !inputs.test_notify && steps.hora.outputs.run == 'true' && (inputs.send_report || (steps.hora.outputs.scheduled == 'true' && steps.hora.outputs.dia == (vars.REPORT_DAY || '1'))) }}
        run: dotnet run --project src/OffersFinder -c Release --no-build -- send-report --file-only

      - name: Recordatorio programado
        # Se envía una sola vez, en la ejecución programada del día indicado en la variable de repositorio
        # REMINDER_DATE (AAAA-MM-DD). Sin esa variable no se envía nada.
        if: ${{ steps.hora.outputs.scheduled == 'true' && steps.hora.outputs.run == 'true' && vars.REMINDER_DATE != '' && steps.hora.outputs.fecha == vars.REMINDER_DATE }}
        run: >
          dotnet run --project src/OffersFinder -c Release --no-build -- notify
          "⏰ Recordatorio de OffersFinder"
          "${REMINDER_TEXT:-Hoy es la fecha que marcaste como recordatorio.} La API de búsqueda ${API_PAUSE_UNTIL:+está en pausa hasta el $API_PAUSE_UNTIL y se reactivará sola ese día.}\n\nPara reactivarla antes (o retrasarla), en GitHub ve a Settings → Secrets and variables → Actions → Variables y edita API_PAUSE_UNTIL: 'none' para activarla ya, o una fecha AAAA-MM-DD.\n\nCada producto gasta 2 consultas de la API por comprobación (Shopping + web)."
        env:
          REMINDER_TEXT: ${{ vars.REMINDER_TEXT }}

      - name: Guardar histórico e informe
        if: ${{ !inputs.test_notify && steps.hora.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.hora.outputs.scheduled }}" = "true" ] && [ "${{ inputs.test_notify }}" != "true" ]; then
            echo "${{ steps.hora.outputs.fecha }}" > data/last-run.txt
          fi
          git add data/history.json data/report.html
          [ -f data/last-run.txt ] && git add data/last-run.txt
          if git diff --cached --quiet; then
            echo "Sin cambios en el histórico."
          else
            git commit -m "chore: actualizar histórico de precios [skip ci]"
            # Si la rama ha avanzado mientras se ejecutaba, se integra antes de subir (hasta 3 intentos).
            for intento in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" && git push && break
              echo "Reintento $intento de la subida del histórico..."; sleep 5
            done
          fi
